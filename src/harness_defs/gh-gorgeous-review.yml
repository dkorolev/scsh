      JUSTIFICATION_CLAUDE_GRADE: review_justification_claude.grade
      JUSTIFICATION_CLAUDE_COMMENTS: review_justification_claude.comments
      JUSTIFICATION_CODEX_GRADE: review_justification_codex.grade
      JUSTIFICATION_CODEX_COMMENTS: review_justification_codex.comments
      JUSTIFICATION_CURSOR_GRADE: review_justification_cursor.grade
      JUSTIFICATION_CURSOR_COMMENTS: review_justification_cursor.comments
      JUSTIFICATION_GROK_GRADE: review_justification_grok.grade
      JUSTIFICATION_GROK_COMMENTS: review_justification_grok.comments
      REVIEWABILITY_CLAUDE_GRADE: review_reviewability_claude.grade
      REVIEWABILITY_CLAUDE_COMMENTS: review_reviewability_claude.comments
      REVIEWABILITY_CODEX_GRADE: review_reviewability_codex.grade
      REVIEWABILITY_CODEX_COMMENTS: review_reviewability_codex.comments
      REVIEWABILITY_CURSOR_GRADE: review_reviewability_cursor.grade
      REVIEWABILITY_CURSOR_COMMENTS: review_reviewability_cursor.comments
      REVIEWABILITY_GROK_GRADE: review_reviewability_grok.grade
      REVIEWABILITY_GROK_COMMENTS: review_reviewability_grok.comments
      SANITY_CLAUDE_GRADE: review_sanity_claude.grade
      SANITY_CLAUDE_COMMENTS: review_sanity_claude.comments
      SANITY_CODEX_GRADE: review_sanity_codex.grade
      SANITY_CODEX_COMMENTS: review_sanity_codex.comments
      SANITY_CURSOR_GRADE: review_sanity_cursor.grade
      SANITY_CURSOR_COMMENTS: review_sanity_cursor.comments
      SANITY_GROK_GRADE: review_sanity_grok.grade
      SANITY_GROK_COMMENTS: review_sanity_grok.comments
      TESTING_CLAUDE_GRADE: review_testing_claude.grade
      TESTING_CLAUDE_COMMENTS: review_testing_claude.comments
      TESTING_CODEX_GRADE: review_testing_codex.grade
      TESTING_CODEX_COMMENTS: review_testing_codex.comments
      TESTING_CURSOR_GRADE: review_testing_cursor.grade
      TESTING_CURSOR_COMMENTS: review_testing_cursor.comments
      TESTING_GROK_GRADE: review_testing_grok.grade
      TESTING_GROK_COMMENTS: review_testing_grok.comments
    prompt: |
      You are preparing ONE GitHub pull-request review from the fleet's findings. Do not run
            any command, do not touch git, and do not call GitHub — only read the inputs and write
            the result.

            Each `*_GRADE` input is a reviewer's grade (excellent, good, average, or poor); an empty
            grade means that reviewer did not run and must be ignored. Each matching `*_COMMENTS`
            input is a JSON array of finding strings from that reviewer; each string leads with a
            bracketed severity and names the commit, file, line, description, and suggestion.

            Compose the review:
            - `findings`: a JSON object `{"items": [...]}`. Turn every reviewer comment into one
              item `{"file": "<path>", "line": <int>, "description": "<what>", "suggestion":
              "<how, or empty>"}`. Read the file and line out of the comment string. Use line 0 when
              a finding is commit- or PR-level rather than tied to a line. Merge duplicate findings
              that different reviewers raise about the same file and line into one item, keeping
              every distinct observation. Order items by file, then line. Emit `{"items": []}` when
              there are no findings.
            - `summary`: a short, gracious, human-voiced paragraph opening the review — the greeting
              and overall read a careful human reviewer would write. No AI, agent, model, or tooling
              attribution of any kind. Do not restate every finding here; the items carry those.
            - `approval_bar`: the boolean `true` only when every reviewer that ran graded excellent
              or good AND there are at least as many excellent as good grades; otherwise `false`.
              (Whether the PR actually qualifies for an approval is decided later at publication.)
    output:
      findings:
        type: object
      summary:
        type: string
      approval_bar:
        type: bool
  publish:
    needs: plan, prepare_claude?, prepare_codex?, prepare_cursor?, prepare_grok?
    inputs:
      PR_URL: params.PR_URL
      FINDINGS_CLAUDE: prepare_claude.findings
      SUMMARY_CLAUDE: prepare_claude.summary
      BAR_CLAUDE: prepare_claude.approval_bar
      FINDINGS_CODEX: prepare_codex.findings
      SUMMARY_CODEX: prepare_codex.summary
      BAR_CODEX: prepare_codex.approval_bar
      FINDINGS_CURSOR: prepare_cursor.findings
      SUMMARY_CURSOR: prepare_cursor.summary
      BAR_CURSOR: prepare_cursor.approval_bar
      FINDINGS_GROK: prepare_grok.findings
      SUMMARY_GROK: prepare_grok.summary
      BAR_GROK: prepare_grok.approval_bar
      PLAN_RAN: plan.ran
    run: |
      # Exactly one prepare_<harness> ran; forward its output to the publisher.
      for h in CLAUDE CODEX CURSOR GROK; do
        eval "f=\$FINDINGS_$h; s=\$SUMMARY_$h; b=\$BAR_$h"
        if [ -n "$f" ]; then FINDINGS="$f"; SUMMARY="$s"; APPROVAL_BAR="$b"; break; fi
      done
      export FINDINGS SUMMARY APPROVAL_BAR
      RAN="$PLAN_RAN" "$SCSH_BIN" gh-review publish
    timeout: 600s
    output:
      review_url:
        type: string
      event:
        type: string
      published:
        type: bool
  quota_after:
    needs: publish, plan
    inputs:
      RAN: plan.ran
    run: |
      "$SCSH_BIN" gh-review quota-after
    timeout: 300s
    output:
      deltas:
        type: string
