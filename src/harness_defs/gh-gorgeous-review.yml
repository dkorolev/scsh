# The multi-harness GitHub PR review. Built into scsh, so a two-harness machine can run it
# with nothing installed. One job, one graph:
#
#   plan (host) -> 20 gated reviewer steps -> prepare_<harness> (agent) -> publish (host) -> quota_after (host)
#
# `plan` decides which harnesses review: it needs the harness logged in AND enough quota
# left (a long window — weekly/monthly/billing — under 10% left benches it, a 5-hour window
# under 25% left benches it). Fewer than two runnable harnesses fails the plan, and the job,
# up front. Each of the five reviewer skills runs on every harness the plan cleared; a
# benched harness shows every one of its reviewer nodes skipped, with the plan reason on the
# node. `prepare_<harness>` runs on the first runnable harness the plan chose as publisher,
# reads the reviewer grades and comments, and writes the review payload (one human-voiced
# summary plus per-file findings) with no GitHub write of its own. `publish`, a host step,
# is the only step that touches GitHub: it posts that one review (COMMENT, or APPROVE when
# the grades clear the bar and the PR qualifies) using the operator's gh credentials.
#
# The reviewer steps run the canonical dkorolev/code-review-skills reviewers, embedded in
# scsh's bundle byte-for-byte; scsh appends only the grade/comments workflow adapter the
# shared reviewer contract already supports. Nothing is pushed and the PR itself is never
# edited — the sole outward effect is the one published review.
description: "Review a GitHub PR with every configured harness (needs two), then publish one GitHub review."
params:
  PR_URL:
    type: string
    required: true
    description: "The GitHub pull-request URL under review (the replica this job runs in was built from it)."
steps:
  plan:
    run: |
      "$SCSH_BIN" gh-review plan
    timeout: 300s
    output:
      claude:
        type: enum
        choices: run, no_credentials, expired, low_quota
      claude_note:
        type: string
      codex:
        type: enum
        choices: run, no_credentials, expired, low_quota
      codex_note:
        type: string
      cursor:
        type: enum
        choices: run, no_credentials, expired, low_quota
      cursor_note:
        type: string
      grok:
        type: enum
        choices: run, no_credentials, expired, low_quota
      grok_note:
        type: string
      publisher:
        type: string
      runnable:
        type: int
      ran:
        type: string
      summary:
        type: string
      quota:
        type: object
  review_conventions_claude:
    needs: plan
    when:
      plan.claude: run
    agent:
      harness: claude
      model: claude-opus-4-8
    skill: conventions-reviewer
    output:
      grade:
        type: enum
        choices: excellent, good, average, poor
      comments:
        type: string_list
  review_conventions_codex:
    needs: plan
    when:
      plan.codex: run
    agent:
      harness: codex
      model: gpt-5.6-terra
      effort: high
    skill: conventions-reviewer
    output:
      grade:
        type: enum
        choices: excellent, good, average, poor
      comments:
        type: string_list
  review_conventions_cursor:
