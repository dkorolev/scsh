# Host-step workflow demo: the existing fruits fan-out with both sorters moved from agents to
# typed commands on the host. The graph makes the executor boundary visible: categorize and
# write_files use Claude in containers, while the two ready host sorters run one at a time in the
# caller's checkout before the final fan-in.
description: "Categorize produce with an agent, sort it on the host, then commit three readable files."
params:
  WORDS:
    type: string
    required: true
    description: "Comma-separated words to categorize (e.g. apple, carrot, pear, onion)"
steps:
  categorize:
    agent:
      harness: claude
      model: sonnet
    inputs:
      WORDS: params.WORDS
    prompt: |
      The WORDS input is a comma-separated list of words. Split them into two groups —
      fruits and vegetables — and return each as a comma-separated string.
    output:
      fruits:
        type: string
      vegetables:
        type: string
  sort_fruits:
    needs: categorize
    inputs:
      LIST: categorize.fruits
    run: |
      python3 - <<'PY'
      import json
      import os

      items = [item.strip() for item in os.environ["LIST"].split(",") if item.strip()]
      with open(os.environ["SCSH_RESULT"], "w", encoding="utf-8") as result:
        json.dump({"sorted": ", ".join(sorted(items, key=str.casefold))}, result)
      PY
    timeout: 30s
    output:
      sorted:
        type: string
  sort_vegetables:
    needs: categorize
    inputs:
      LIST: categorize.vegetables
    run: |
      python3 - <<'PY'
      import json
      import os

      items = [item.strip() for item in os.environ["LIST"].split(",") if item.strip()]
      with open(os.environ["SCSH_RESULT"], "w", encoding="utf-8") as result:
        json.dump({"sorted": ", ".join(sorted(items, key=str.casefold))}, result)
      PY
    timeout: 30s
    output:
      sorted:
        type: string
  write_files:
    needs: sort_fruits, sort_vegetables
    agent:
      harness: claude
      model: sonnet
    commits: true
    inputs:
      FRUITS: sort_fruits.sorted
      VEGGIES: sort_vegetables.sorted
    prompt: |
      FRUITS and VEGGIES are alphabetically sorted comma-separated lists from two native host
      steps. Create exactly these three files at the repository root:

      1. `README.md`:

         # Produce

         This repository was generated by the `scsh` fruits-host-sort workflow.

         - [Fruits](FRUITS.md)
         - [Veggies](VEGGIES.md)

      2. `FRUITS.md`: start with `# Fruits`, then one `- item` line per trimmed, non-empty FRUITS
         item, preserving the supplied order. If the list is empty, write `_None._` instead.
      3. `VEGGIES.md`: start with `# Veggies`, then one `- item` line per trimmed, non-empty
         VEGGIES item, preserving the supplied order. If the list is empty, write `_None._`
         instead.

      Commit ONLY `README.md`, `FRUITS.md`, and `VEGGIES.md` with the exact message
      `fruits-host-sort: add sorted produce lists`. Do not touch any other file and do not use the
      network. Return `committed: true` only after the commit succeeds.
    output:
      committed:
        type: bool
